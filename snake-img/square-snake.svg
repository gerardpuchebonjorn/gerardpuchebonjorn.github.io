<svg viewBox="0 0 400 252" role="img" aria-label="A valid snake of length 2 on the square: 00 to 10 to 11" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1a1a1a">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1a1a"/></marker>
</defs>
<text x="200" y="28" text-anchor="middle" font-weight="600" font-size="13">a longest snake on the square (length 2)</text>
<line x1="80" y1="170" x2="320" y2="170" stroke="#d5d0c4" stroke-width="2"/>
<line x1="320" y1="170" x2="320" y2="60" stroke="#d5d0c4" stroke-width="2"/>
<line x1="320" y1="60" x2="80" y2="60" stroke="#d5d0c4" stroke-width="2"/>
<line x1="80" y1="60" x2="80" y2="170" stroke="#d5d0c4" stroke-width="2"/>
<line x1="80" y1="170" x2="320" y2="170" stroke="#c45c26" stroke-width="3.2" stroke-linecap="round"/>
<line x1="320" y1="170" x2="320" y2="60" stroke="#c45c26" stroke-width="3.2" stroke-linecap="round"/>
<circle cx="80" cy="170" r="9" fill="#c45c26" stroke="#c45c26"/>
<text x="80" y="174" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">0</text>
<circle cx="320" cy="170" r="9" fill="#c45c26" stroke="#c45c26"/>
<text x="320" y="174" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">1</text>
<circle cx="320" cy="60" r="9" fill="#c45c26" stroke="#c45c26"/>
<text x="320" y="64" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">2</text>
<circle cx="80" cy="60" r="7" fill="#fff" stroke="#d5d0c4" stroke-width="1.5"/>
<text x="80" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">00</text>
<text x="320" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">10</text>
<text x="80" y="88" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">01</text>
<text x="320" y="88" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">11</text>
<text x="200" y="230" text-anchor="middle" fill="#6b675e" font-size="12">00 → 10 → 11 · we skip 01 on purpose</text>
