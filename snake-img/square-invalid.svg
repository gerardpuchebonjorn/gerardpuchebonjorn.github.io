<svg viewBox="0 0 400 252" role="img" aria-label="An invalid path on the square: going all the way around creates a forbidden chord" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1a1a1a">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1a1a"/></marker>
</defs>
<text x="200" y="28" text-anchor="middle" font-weight="600" font-size="13">not a snake: a chord sneaks in</text>
<line x1="80" y1="170" x2="320" y2="170" stroke="#d5d0c4" stroke-width="2"/>
<line x1="320" y1="170" x2="320" y2="60" stroke="#d5d0c4" stroke-width="2"/>
