<svg viewBox="0 0 420 300" role="img" aria-label="An invalid path on the square that creates a forbidden chord" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1a1a1a">
<text x="210" y="28" text-anchor="middle" font-weight="600" font-size="13">not a snake: a chord sneaks in</text>
<line x1="140" y1="215" x2="280" y2="215" stroke="#d5d0c4" stroke-width="2"/>
<line x1="280" y1="215" x2="280" y2="75" stroke="#d5d0c4" stroke-width="2"/>
<line x1="280" y1="75" x2="140" y2="75" stroke="#d5d0c4" stroke-width="2"/>
<line x1="140" y1="75" x2="140" y2="215" stroke="#d5d0c4" stroke-width="2"/>
<line x1="140" y1="215" x2="280" y2="215" stroke="#c45c26" stroke-width="3.2" stroke-linecap="round"/>
<line x1="280" y1="215" x2="280" y2="75" stroke="#c45c26" stroke-width="3.2" stroke-linecap="round"/>
<line x1="280" y1="75" x2="140" y2="75" stroke="#c45c26" stroke-width="3.2" stroke-linecap="round"/>
<line x1="140" y1="215" x2="140" y2="75" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="140" cy="215" r="10" fill="#c45c26" stroke="#c45c26"/>
<text x="140" y="219" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">0</text>
<circle cx="280" cy="215" r="10" fill="#c45c26" stroke="#c45c26"/>
<text x="280" y="219" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">1</text>
<circle cx="280" cy="75" r="10" fill="#c45c26" stroke="#c45c26"/>
<text x="280" y="79" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">2</text>
<circle cx="140" cy="75" r="10" fill="#c45c26" stroke="#c45c26"/>
<text x="140" y="79" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">3</text>
<text x="140" y="247" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">00</text>
<text x="280" y="247" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">10</text>
<text x="140" y="57" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">01</text>
<text x="280" y="57" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">11</text>
<text x="210" y="280" text-anchor="middle" fill="#c0392b" font-size="12">00 and 01 are neighbours, but not next to each other on the path</text>
</svg>
