<text x="80" y="64" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">3</text>
<text x="80" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">00</text>
<text x="320" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">10</text>
<text x="80" y="88" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">01</text>
<text x="320" y="88" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12">11</text>
<text x="200" y="230" text-anchor="middle" fill="#c0392b" font-size="12">00 and 01 are neighbours, but not next to each other on the path</text>
