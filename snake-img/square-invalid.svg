<line x1="80" y1="170" x2="320" y2="170" stroke="#c45c26" stroke-width="3.2" stroke-linecap="round"/>
<line x1="320" y1="170" x2="320" y2="60" stroke="#c45c26" stroke-width="3.2" stroke-linecap="round"/>
<line x1="320" y1="60" x2="80" y2="60" stroke="#c45c26" stroke-width="3.2" stroke-linecap="round"/>
<line x1="80" y1="170" x2="80" y2="60" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="80" cy="170" r="9" fill="#c45c26" stroke="#c45c26"/>
<text x="80" y="174" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">0</text>
<circle cx="320" cy="170" r="9" fill="#c45c26" stroke="#c45c26"/>
<text x="320" y="174" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">1</text>
